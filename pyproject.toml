[project]
name = "coolguard"
version = "0.1.0"
description = "Evidence-driven visual debugging and performance engineering MCP server for OpenCV 5 / COOL"
requires-python = ">=3.10"
dependencies = [
  "opencv-python-headless==5.0.0.93",
  "numpy>=2.0",
  "mcp>=2.3,<3",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
coolguard = "coolguard.cli:main"
coolguard-mcp = "coolguard.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
